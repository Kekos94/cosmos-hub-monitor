name: Daily Cosmos Monitor

on:
  schedule:
    - cron: "17 2 * * *"
      timezone: "Europe/Paris"
    - cron: "17 8 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Publier le tableau de bord depuis les données sauvegardées, sans relancer la collecte"
        required: false
        default: false
        type: boolean
      start_date:
        description: "Première journée UTC (YYYY-MM-DD), seulement pour initialiser un historique vide"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cosmos-monitor-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_night:
    if: github.event_name == 'schedule' && github.event.schedule == '17 8 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check the previous scheduled run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from datetime import datetime
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          query = urlencode({
              'event': 'schedule', 'branch': os.environ['GITHUB_REF_NAME'], 'per_page': 30,
          })
          url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/workflows/daily.yml/runs?{query}")
          request = Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          paris = ZoneInfo('Europe/Paris')

          def created(run):
              return datetime.fromisoformat(run['created_at'].replace('Z', '+00:00')).astimezone(paris)

          try:
              with urlopen(request, timeout=15) as response:
                  runs = json.load(response)['workflow_runs']
              current = next(run for run in runs if str(run['id']) == os.environ['GITHUB_RUN_ID'])
              cutoff = created(current)
              previous = max(
                  (run for run in runs if created(run).date() == cutoff.date() and created(run) < cutoff),
                  key=created, default=None,
              )
              if previous and previous['conclusion'] == 'success':
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write('skip=true\n')
                  print(f"Nightly run {previous['id']} succeeded. Skipping morning recovery.")
              else:
                  print('No successful nightly run found. Starting morning recovery.')
          except (OSError, ValueError, KeyError, StopIteration) as exc:
              print(f'Could not check nightly run ({exc}). Starting morning recovery.')
          PYTHON

  run:
    needs: check_night
    if: ${{ !cancelled() && needs.check_night.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests and archive integrity
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Dashboard data and filter checks
        run: node --test tests/dashboard.test.js

      - name: Collect complete UTC days with checkpoints
        id: collect
        if: inputs.publish_only != true
        continue-on-error: true
        env:
          COLLECT_BUDGET_SECONDS: "9000"
          CHUNK_BLOCKS: "120"
          COLLECT_WORKERS: "2"
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
          START_DATE: ${{ inputs.start_date }}
        run: python run_criteria1_pipeline.py

      - name: Audit fees for complete UTC days
        id: fee_audit
        if: inputs.publish_only != true
        continue-on-error: true
        env:
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion1_fee_audit.py --pending --budget-seconds 900

      # A network failure must not discard already validated chunks.
      - name: Validate checkpoints and build daily export
        run: python inflation_overlay.py

      - name: Generate HTML dashboard
        run: python generate_dashboard_html.py

      - name: Commit progress and complete days together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hub_criterion1_daily_complete.csv site/hub_criterion1_daily_complete.csv
          if test -d data/criterion1_fee_audits; then
            git add data/criterion1_fee_audits
          fi
          if test -d data/criterion1_days; then
            git add data/criterion1_days
          fi
          git add site/hub_revenue_daily.csv site/hub_revenue_with_inflation.csv site/index.html
          git add site/criterion1.html site/dashboard.css site/dashboard.js
          git add site/index-en.html site/criterion1-en.html site/criterion2-en.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update: UTC-day collection checkpoints and verified daily totals"
            git push
          fi

      - name: Report collection failure after saving progress
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Collection failed. Validated progress was saved; the next run resumes it."
          exit 1

      - name: Deploy to GitHub Pages
        id: deploy_first
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      - name: Wait before retrying GitHub Pages
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 15

      - name: Retry GitHub Pages publication
        id: deploy_second
        if: steps.deploy_first.outcome == 'failure'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      - name: Wait before final publication attempt
        if: steps.deploy_second.outcome == 'failure'
        run: sleep 30

      # Re-run the action so each attempt fetches the latest gh-pages state.
      # No force-push or permission changes; final failure remains visible.
      - name: Final GitHub Pages publication attempt
        if: steps.deploy_second.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site


      - name: Report fee audit failure after saving and publishing progress
        if: steps.fee_audit.outcome == 'failure'
        run: |
          echo "Fee audit interrupted. Validated chunks were saved for the next run."
          exit 1
