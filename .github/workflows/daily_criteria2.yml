name: Criterion 1B — Multichain IBC flows

on:
  workflow_run:
    workflows: ['Criterion 1A, 1C, 1D — Hub economy']
    types: [completed]
  workflow_dispatch:
    inputs:
      start_date:
        description: "Première journée UTC (YYYY-MM-DD), seulement pour initialiser une collecte vide"
        required: false
        type: string
      publish_only:
        description: "Régénérer et publier le sous-critère 1B sans collecter de nouveaux transferts"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Same repository writer lock as the Hub economy workflow: never race git pushes or Pages.
concurrency:
  group: cosmos-monitor-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_economy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_only != true &&
      github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify the completed Economy collection
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import csv
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          base = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions"
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          }

          def get(path):
              with urlopen(Request(base + path, headers=headers), timeout=15) as response:
                  return json.load(response)

          def start(run):
              return datetime.fromisoformat(run['run_started_at'].replace('Z', '+00:00')).astimezone(timezone.utc)

          def collection_outcome(run):
              jobs = get(f"/runs/{run['id']}/attempts/{run['run_attempt']}/jobs")['jobs']
              for job in jobs:
                  if job['name'] != 'run' or job['conclusion'] == 'skipped':
                      continue
                  for step in job.get('steps') or []:
                      if step['name'] == 'Collect complete UTC days with checkpoints':
                          if step['conclusion'] == 'skipped':
                              return None
                          return (
                              run['conclusion'] == 'success' and job['conclusion'] == 'success' and
                              step['conclusion'] == 'success'
                          )
                  return False
              return None

          if 'workflow_run' in event:
              run = event['workflow_run']
              collected = collection_outcome(run)
              target = start(run).date()
          else:
              target = datetime.now(timezone.utc).date()
              runs = get('/workflows/daily.yml/runs?status=completed&per_page=30')['workflow_runs']
              collected = False
              for run in sorted(runs, key=start, reverse=True):
                  if run['head_branch'] != event['repository']['default_branch'] or start(run).date() != target:
                      continue
                  outcome = collection_outcome(run)
                  if outcome is not None:
                      collected = outcome
                      break
          day = (target - timedelta(days=1)).isoformat()
          with open('hub_criterion1_daily_complete.csv', newline='', encoding='utf-8') as stream:
              complete = any(
                  row['date'] == day and row['chain_id'] == 'cosmoshub-4' and
                  row['coverage_status'] == 'complete_utc_day_blocks' and row['block_coverage_pct'] == '100'
                  for row in csv.DictReader(stream)
              )
          if collected and complete:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('ready=true\n')
              print(f'Economy collection for {day} is complete. Starting IBC.')
          else:
              print(f'No completed Economy collection for {day} in this attempt. IBC skipped.')
          PYTHON

  criterion2:
    needs: check_economy
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.publish_only == true) || needs.check_economy.outputs.ready == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Dashboard data and filter checks
        run: node --test tests/dashboard.test.js
      - name: Collect indexed IBC days
        id: collect
        if: inputs.publish_only != true
        continue-on-error: true
        env:
          START_DATE: ${{ inputs.start_date }}
          CRITERION2_BUDGET_SECONDS: "2400"
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion2_pipeline.py
      - name: Reconcile IBC confirmations and refund evidence
        id: lifecycle
        if: inputs.publish_only != true
        continue-on-error: true
        env:
          LIFECYCLE_BUDGET_SECONDS: "1200"
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion2_lifecycle_collect.py
      - name: Verify same-message Hub PFM transit
        id: transit
        if: inputs.publish_only != true
        continue-on-error: true
        env:
          TRANSIT_BUDGET_SECONDS: "300"
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion2_transit_collect.py
      - name: Verify historical routes for registered RWA
        if: inputs.publish_only != true
        env:
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion2_rwa_view.py --collect-routes 60
      - name: Collect registered RWA balances at UTC close
        if: inputs.publish_only != true
        env:
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion2_rwa_balances.py --collect 90
      - name: Validate and export historical valuations
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
        run: python criterion2_export.py --fetch-prices
      - name: Generate Criterion 1B page
        run: python publish_criterion2.py
      - name: Commit Criterion 1B data and progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ibc_rwa_daily.csv site/ibc_rwa_daily.csv data/criterion2_rwa_registry
          git add ibc_rwa_balances_daily.csv site/ibc_rwa_balances_daily.csv
          if test -d data/criterion2_rwa_balances; then
            git add data/criterion2_rwa_balances
          fi
          git add ibc_transit_*.csv site/ibc_transit_*.csv
          if test -d data/criterion2_transit; then
            git add data/criterion2_transit
          fi
          git add ibc_net_windows_chains_latest.csv ibc_net_windows_assets_latest.csv site/ibc_net_windows_chains_latest.csv site/ibc_net_windows_assets_latest.csv
          git add criterion2_progress.csv ibc_out_assets_daily.csv ibc_out_chains_daily.csv ecosystem_out_usd_daily.csv
          git add ibc_net_chains_daily.csv ibc_net_assets_daily.csv site/ibc_net_chains_daily.csv site/ibc_net_assets_daily.csv
          git add ibc_lifecycle_daily.csv ibc_lifecycle_progress.csv ibc_packet_lifecycle.csv.gz
          git add site/ibc_lifecycle_daily.csv site/ibc_lifecycle_progress.csv site/ibc_packet_lifecycle.csv.gz
          git add criterion2_incoming_progress.csv ibc_in_assets_daily.csv ibc_in_chains_daily.csv ecosystem_in_usd_daily.csv
          git add site/criterion2_incoming_progress.csv site/ibc_in_assets_daily.csv site/ibc_in_chains_daily.csv site/ecosystem_in_usd_daily.csv
          git add site/criterion2.html site/criterion2_progress.csv site/ibc_out_assets_daily.csv site/ibc_out_chains_daily.csv site/ecosystem_out_usd_daily.csv
          git add site/index.html site/dashboard.css site/dashboard.js
          git add site/index-en.html site/criterion1-en.html site/criterion2-en.html
          if test -d data/criterion2; then
            git add data/criterion2
          fi
          if test -d data/criterion2_incoming; then
            git add data/criterion2_incoming
          fi
          if test -d data/criterion2_lifecycle; then
            git add data/criterion2_lifecycle
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Criterion 1B indexed IBC transfers and historical valuations"
            git push
          fi
      - name: Report collection errors after preserving checked pages
        if: steps.collect.outcome == 'failure' || steps.lifecycle.outcome == 'failure' || steps.transit.outcome == 'failure'
        run: exit 1
      - name: Publish site
        id: deploy_first
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
      - name: Wait before publication retry
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 15
      - name: Retry publication
        id: deploy_second
        if: steps.deploy_first.outcome == 'failure'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
      - name: Wait before final publication retry
        if: steps.deploy_second.outcome == 'failure'
        run: sleep 30
      - name: Final publication retry
        if: steps.deploy_second.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
