name: Criterion 2 — IBC multichain

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Paris"
    - cron: "17 12 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Première journée UTC (YYYY-MM-DD), seulement pour initialiser une collecte vide"
        required: false
        type: string
      publish_only:
        description: "Régénérer et publier le critère 2 sans collecter de nouveaux transferts"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Same repository writer lock as Criterion 1: never race git pushes or Pages.
concurrency:
  group: cosmos-monitor-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_morning:
    if: github.event_name == 'schedule' && github.event.schedule == '17 12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Check the morning run and UTC day coverage
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import csv
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          query = urlencode({
              'event': 'schedule', 'branch': os.environ['GITHUB_REF_NAME'], 'per_page': 30,
          })
          url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/workflows/daily_criteria2.yml/runs?{query}")
          request = Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          paris = ZoneInfo('Europe/Paris')

          def created(run):
              return datetime.fromisoformat(run['created_at'].replace('Z', '+00:00')).astimezone(paris)

          def rows_for(path, day):
              with open(path, newline='', encoding='utf-8') as stream:
                  return [row for row in csv.DictReader(stream) if row['date'] == day]

          try:
              with urlopen(request, timeout=15) as response:
                  runs = json.load(response)['workflow_runs']
              current = next(run for run in runs if str(run['id']) == os.environ['GITHUB_RUN_ID'])
              cutoff = created(current)
              morning = max(
                  (run for run in runs if created(run).date() == cutoff.date() and created(run) < cutoff),
                  key=created, default=None,
              )
              if morning and morning['conclusion'] == 'success':
                  day = (cutoff.astimezone(timezone.utc).date() - timedelta(days=1)).isoformat()
                  config = json.loads(Path('config/criterion2_chains.json').read_text())
                  expected = {chain['chain_id'] for chain in config['chains']}
                  net = rows_for('site/ibc_net_chains_daily.csv', day)
                  transit = rows_for('site/ibc_transit_daily.csv', day)
                  # A common indexed day requires both directions and all lifecycle streams.
                  complete = (
                      {row['chain_id'] for row in net} == expected
                      and all(row['coverage_status'] == 'common_indexed_day' for row in net)
                      and bool(transit)
                      and all(row['collection_status'] == 'candidate_proofs_complete' for row in transit)
                  )
                  if complete:
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                          output.write('skip=true\n')
                      print(f"Morning run {morning['id']} succeeded and IBC coverage for {day} is complete.")
                  else:
                      print(f'IBC coverage for {day} is missing or incomplete. Starting recovery.')
              else:
                  print('No successful morning run found. Starting recovery.')
          except (OSError, ValueError, KeyError, StopIteration) as exc:
              print(f'Could not check morning run or coverage ({exc}). Starting recovery.')
          PYTHON

  criterion2:
    needs: check_morning
    if: ${{ !cancelled() && needs.check_morning.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Dashboard data and filter checks
        run: node --test tests/dashboard.test.js
      - name: Collect indexed IBC days
        id: collect
        if: inputs.publish_only != true
        continue-on-error: true
        env:
          START_DATE: ${{ inputs.start_date }}
          CRITERION2_BUDGET_SECONDS: "1200"
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion2_pipeline.py
      - name: Reconcile IBC confirmations and refund evidence
        id: lifecycle
        if: inputs.publish_only != true
        continue-on-error: true
        env:
          LIFECYCLE_BUDGET_SECONDS: "1200"
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion2_lifecycle_collect.py
      - name: Verify same-message Hub PFM transit
        id: transit
        if: inputs.publish_only != true
        continue-on-error: true
        env:
          TRANSIT_BUDGET_SECONDS: "300"
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion2_transit_collect.py
      - name: Verify historical routes for registered RWA
        if: inputs.publish_only != true
        env:
          HTTP_MIN_INTERVAL_SECONDS: "1.0"
        run: python criterion2_rwa_view.py --collect-routes 60
      - name: Validate and export historical valuations
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
        run: python criterion2_export.py --fetch-prices
      - name: Generate Criterion 2 page
        run: python publish_criterion2.py
      - name: Commit Criterion 2 data and progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ibc_rwa_daily.csv site/ibc_rwa_daily.csv data/criterion2_rwa_registry
          git add ibc_transit_*.csv site/ibc_transit_*.csv
          if test -d data/criterion2_transit; then
            git add data/criterion2_transit
          fi
          git add ibc_net_windows_chains_latest.csv ibc_net_windows_assets_latest.csv site/ibc_net_windows_chains_latest.csv site/ibc_net_windows_assets_latest.csv
          git add criterion2_progress.csv ibc_out_assets_daily.csv ibc_out_chains_daily.csv ecosystem_out_usd_daily.csv
          git add ibc_net_chains_daily.csv ibc_net_assets_daily.csv site/ibc_net_chains_daily.csv site/ibc_net_assets_daily.csv
          git add ibc_lifecycle_daily.csv ibc_lifecycle_progress.csv ibc_packet_lifecycle.csv.gz
          git add site/ibc_lifecycle_daily.csv site/ibc_lifecycle_progress.csv site/ibc_packet_lifecycle.csv.gz
          git add criterion2_incoming_progress.csv ibc_in_assets_daily.csv ibc_in_chains_daily.csv ecosystem_in_usd_daily.csv
          git add site/criterion2_incoming_progress.csv site/ibc_in_assets_daily.csv site/ibc_in_chains_daily.csv site/ecosystem_in_usd_daily.csv
          git add site/criterion2.html site/criterion2_progress.csv site/ibc_out_assets_daily.csv site/ibc_out_chains_daily.csv site/ecosystem_out_usd_daily.csv
          git add site/index.html site/dashboard.css site/dashboard.js
          git add site/index-en.html site/criterion1-en.html site/criterion2-en.html
          if test -d data/criterion2; then
            git add data/criterion2
          fi
          if test -d data/criterion2_incoming; then
            git add data/criterion2_incoming
          fi
          if test -d data/criterion2_lifecycle; then
            git add data/criterion2_lifecycle
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Criterion 2 indexed IBC transfers and historical valuations"
            git push
          fi
      - name: Report collection errors after preserving checked pages
        if: steps.collect.outcome == 'failure' || steps.lifecycle.outcome == 'failure' || steps.transit.outcome == 'failure'
        run: exit 1
      - name: Publish site
        id: deploy_first
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
      - name: Wait before publication retry
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 15
      - name: Retry publication
        id: deploy_second
        if: steps.deploy_first.outcome == 'failure'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
      - name: Wait before final publication retry
        if: steps.deploy_second.outcome == 'failure'
        run: sleep 30
      - name: Final publication retry
        if: steps.deploy_second.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
